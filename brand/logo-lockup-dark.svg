<!--
  My PaperTrader — horizontal lockup, DARK backgrounds.
  Wordmark treatment A: "My" muted, "Paper" white, "Trader" green.
  For external use (README, social cards, decks). IN THE APP, render the
  wordmark as live HTML text next to icon.svg — see brand/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="300" height="56" role="img" aria-label="My PaperTrader">
  <title>My PaperTrader</title>

  <g transform="translate(4 4)">
    <rect width="48" height="48" rx="12" fill="#0E1512" stroke="#22C55E" stroke-width="1.5"/>
    <path d="M11 35.5l9-10 6 6 11-15" fill="none" stroke="#E8FDF0" stroke-width="1"
          stroke-linecap="round" stroke-linejoin="round" opacity=".3"/>
    <path d="M11 33l9-10 6 6 11-15" fill="none" stroke="#22C55E" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 14h6v6" fill="none" stroke="#22C55E" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="66" y="36"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="24" letter-spacing="-0.5">
    <tspan fill="#7D8892" font-weight="500">My </tspan><tspan fill="#F2F4F6" font-weight="650">Paper</tspan><tspan fill="#22C55E" font-weight="650">Trader</tspan>
  </text>
</svg>
